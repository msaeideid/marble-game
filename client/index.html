<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VANGUARD (prototype)</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2a41; font-family: system-ui, sans-serif; }
      #game { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
      #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
      #hud .status { position: absolute; left: 12px; bottom: 8px; font-size: 12px; opacity: 0.8; }
      #hud .help { position: absolute; right: 12px; bottom: 8px; font-size: 12px; opacity: 0.7; text-align: right; line-height: 1.5; }
      @media (max-width: 700px) { #hud .help { display: none; } }
      #crosshair { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px;
        border: 2px solid rgba(255,255,255,.7); border-radius: 50%; box-sizing: border-box; }
      #crosshair.valid { border-color: #5dff8a; background: rgba(93,255,138,.25); }
      #energy { position: absolute; left: 50%; bottom: 28px; width: min(320px, 60vw); height: 12px; margin-left: calc(min(320px, 60vw) / -2);
        background: rgba(0,0,0,.35); border-radius: 6px; overflow: hidden; }
      #energy-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #38c6ff, #7af0ff); transition: width .05s linear; }
      #energy-fill.low { background: linear-gradient(90deg, #ff6b6b, #ffb36b); }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="hud">
      <div id="crosshair"></div>
      <div id="energy"><div id="energy-fill"></div></div>
      <div class="status" id="build">VANGUARD prototype</div>
      <div class="help">
        WASD move · Space jump · drag/click to look<br />
        Hold E or right-mouse: swing · Shift: reel in · F: zip-pull
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
